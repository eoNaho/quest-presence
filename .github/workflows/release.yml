name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties (webhook secrets)
        run: |
          echo "webhookId=${{ secrets.WEBHOOK_ID }}" >> local.properties
          echo "webhook=${{ secrets.WEBHOOK_TOKEN }}" >> local.properties

      - name: Write release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > quest-presence-release.jks
          cat > keystore.properties <<EOF
          RELEASE_STORE_FILE=../quest-presence-release.jks
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
